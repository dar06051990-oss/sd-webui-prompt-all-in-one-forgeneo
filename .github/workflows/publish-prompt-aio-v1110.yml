name: Publish Prompt AIO v1.1.10 (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prompt-aio-v1110.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore owner-tested update into project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          payload = """"""
          expected = {
              'scripts/physton_prompt/history.py',
              'scripts/physton_prompt/storage.py',
              'scripts/physton_prompt/portable.py',
              'scripts/storage_import_ui.py',
              'javascript/prompt-aio-responsive-tags.js',
          }
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload, validate=True))) as archive:
              seen = set()
              for item in archive.infolist():
                  assert not item.is_dir(), item.filename
                  assert item.filename in expected, 'Unexpected file: ' + item.filename
                  assert item.filename not in seen, 'Duplicate: ' + item.filename
                  assert item.file_size < 65536, 'Unexpected source file size'
                  seen.add(item.filename)
                  destination = Path(item.filename)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(item))
              assert seen == expected, 'Missing files: ' + str(expected - seen)
          print('Applied 5 tested source files; no user storage JSON was included.')
          PY
      - name: Validate Python and responsive JavaScript
        shell: bash
        run: |
          python3 -m py_compile scripts/physton_prompt/history.py scripts/physton_prompt/storage.py scripts/physton_prompt/portable.py scripts/storage_import_ui.py
          node --check javascript/prompt-aio-responsive-tags.js
          python3 - <<'PY'
          import importlib.util, io, json, tempfile, zipfile
          from pathlib import Path
          src = Path('scripts/physton_prompt/portable.py')
          spec=importlib.util.spec_from_file_location('prompt_aio_portable_test',src)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              m.ROOT=Path(td)
              def encode(x): return json.dumps(x).encode()
              (m.ROOT/'history.txt2img.json').write_bytes(encode([{'id':'1','prompt':'old'}]))
              (m.ROOT/'settings.json').write_bytes(encode({'keep':True}))
              data=io.BytesIO()
              with zipfile.ZipFile(data,'w') as out:
                  out.writestr('history.txt2img.json',encode([{'id':'1','prompt':'old'},{'id':'2','prompt':'new'}]))
                  out.writestr('settings.json',encode({'keep':False}))
              m.import_backup(data.getvalue(), merge=True)
              assert len(json.loads((m.ROOT/'history.txt2img.json').read_bytes())) == 2
              assert json.loads((m.ROOT/'settings.json').read_bytes()) == {'keep':True}
              assert 'Новых записей нет' in m.import_backup(data.getvalue(), merge=True)
              m.import_backup(data.getvalue(),merge=False)
              assert json.loads((m.ROOT/'settings.json').read_bytes()) == {'keep':False}
          print('Import, merge, duplicate protection, full replace and backup test OK')
          PY
      - name: Update documentation and package installable update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          en=Path('README.MD')
          ru=Path('README_RU.MD')
          en_note="""## Forge Neo release v1.1.10 (2026-11-16)

          - Consolidates Prompt AIO controls into **Settings → Prompt All-in-One**; removes the separate **Prompt AIO Import** tab.
          - Backup and restore ZIP files, or import from any old Forge install's **storage** folder; no old extension installation is needed.
          - **Transfer all** replaces source-matching JSON with an automatic backup. **Add history and favorites** merges records without duplicate IDs, leaving current settings intact.
          - History maximum per type: 100 / 200 / 500 / 1000 / 5000 / unlimited; favorites are unrestricted.
          - Modern Windows folder picker; compact transfer controls.
          - Responsive prompt tags: fixes text and translation overlap and disappearing delete controls on long prompts or browser zoom.
          - Original prompt editor, translator, LoRA processing and image generation behavior unchanged.
          - The actual user data in `storage/` is **not part of the release**.

          **Update:** In Forge Neo Extensions, update this repository and fully restart Forge Neo. Before updating, consider backing up your own `storage/` folder.

          """
          ru_note="""## Forge Neo — обновление v1.1.10 (16.11.2026)

          - Единый раздел **Settings → Prompt All-in-One** вместо отдельной вкладки импорта.
          - Резервная копия ZIP, перенос настроек, истории и избранного из ZIP или папки `storage` любой установки Forge.
          - **Перенести всё** заменяет совпадающие JSON с резервной копией. **Добавить историю и избранное** объединяет записи без дубликатов, не меняя настройки.
          - Настраиваемый лимит истории для каждого типа: 100, 200, 500, 1000, 5000 либо без ограничения. Избранное не ограничено.
          - Компактное оформление и современный выбор папки в Windows.
          - Исправлено наложение длинных тегов и переводов, а также исчезновение крестиков при изменении масштаба.
          - Данные пользователя в папке `storage` **не включены в релиз**.

          Для обновления воспользуйся вкладкой Extensions в Forge Neo и полностью перезапусти Forge. Перед обновлением желательно сохранить свою папку `storage`.

          """
          for f,prefix in ((en,en_note),(ru,ru_note)):
              old=f.read_text(encoding='utf-8-sig')
              if '## Forge Neo release v1.1.10' in old or '## Forge Neo — обновление v1.1.10' in old:
                  raise RuntimeError('The release note has already been applied')
              f.write_text(prefix+'\n'+old,encoding='utf-8')
          paths=[
              'scripts/physton_prompt/history.py',
              'scripts/physton_prompt/storage.py',
              'scripts/physton_prompt/portable.py',
              'scripts/storage_import_ui.py',
              'javascript/prompt-aio-responsive-tags.js',
          ]
          with zipfile.ZipFile('Prompt-AIO-v1.1.10-FORGENEO-update.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              for source in paths:
                  archive.write(source,'sd-webui-prompt-all-in-one-forgeneo/'+source)
          Path('FORGENEO-RELEASE-v1.1.10.md').write_text((ru_note+'\n---\n\n'+en_note).rstrip()+'\n',encoding='utf-8')
          PY
      - name: Commit release source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/physton_prompt/history.py scripts/physton_prompt/storage.py scripts/physton_prompt/portable.py scripts/storage_import_ui.py README.MD README_RU.MD FORGENEO-RELEASE-v1.1.10.md
          git add -f javascript/prompt-aio-responsive-tags.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'No release changes found'; exit 1; }
          git commit -m 'feat(forge-neo): Prompt AIO v1.1.10 import, history and layout improvements'
          git push origin HEAD:main
      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.1.10-forgeneo Prompt-AIO-v1.1.10-FORGENEO-update.zip --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Prompt All-in-One for Forge Neo v1.1.10" --notes-file FORGENEO-RELEASE-v1.1.10.md --latest
